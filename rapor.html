<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- ============================================================
     AYLIK RAPOR — 25 Kasım 2026'dan beri KABUĞUN İÇİNDE (116. dosya)
     ============================================================
     Tayfun: "Aylık rapora tıklayınca başka bir sayfaya geçmesin. Sol
     taraf sabit kalsın ve rapor hemen önüme düşmesin. Seçimler yapılsın,
     ön izleme çıksın, sonra PDF olarak indirilebilsin."

     Önce bu sayfa kabuğu (app-shell.js) kullanmıyordu: kendi koyu
     şeridi, kendi giriş ekranı, kendi bağlantıları vardı ve açılır
     açılmaz ilk şantiyenin raporunu çiziyordu.

     ⚠ RAPORUN STİLİ GÖLGE DOM'DA. Kabuğun stil dosyası (app.css) ile
     bu raporunki 30'dan fazla kuralda çakışıyor (table, th, td, .btn,
     .msg, .tile, .bar, .antet…). app.css raporun içine sızarsa
     İŞVERENE GİDEN EVRAKIN görünüşü değişir. Rapor kâğıdı #out'a
     bağlı bir gölge kökün içinde çiziliyor; stili <template
     id="rapor-stil">de, eskisinin aynısı. Kabuk dışarıda, rapor
     içeride — birbirine dokunmuyorlar.
     Doğrulama: taşımadan önceki ve sonraki PDF sayfa sayfa
     karşılaştırıldı (116. dosya).

     Tema ve yazı boyutu rapora bilerek UYGULANMIYOR: kâğıt her zaman
     beyaz, punto A4 düzenine göre sabit. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collarlog · Aylık Rapor</title>
<link rel="icon" href="logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="logo/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="logo/png/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16212A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css?v=67">
<style>
/* Sayfa düzeyi: önizleme çerçevesi ve BASKIDA kabuğun gizlenmesi.
   Raporun kendi stili aşağıdaki <template>'te, gölge kökün içinde. */
#onizleme{overflow-x:auto}
#out{display:block;zoom:var(--onizleme-olcek,1)}
#onizleme-bas{margin-top:4px}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff !important}
  .sp-side,.sp-top,.sp-serit,#rapor-secim,#secim-yok,#onizleme-bas{display:none !important}
  .sp-shell,.sp-main{display:block !important}
  .sp-icerik{padding:0 !important;max-width:none !important}
  #onizleme{overflow:visible}
  #out{zoom:1 !important}
}
</style>
<template id="rapor-stil">
<style>
:host{
  --bg:#f4f7f9;--card:#fff;--paper:#fff;--card-2:#fafcfd;--line:#e2eaef;--line-soft:#eef3f6;
  --ink:#0d1f2b;--ink-2:#4a6575;--ink-3:#7e9aa8;
  --accent:#12708f;--accent-2:#4bb3d6;--accent-soft:#e6f2f7;--accent-ink:#0b4d64;--navy:#0f2537;
  --pq:#0f2537;--hq:#12708f;--nq:#4bb3d6;--pw:#7cc9e3;--kaya:#a8815a;--kaya-2:#c6a988;
  --good:#1f7a55;--good-soft:#e3f3ec;--warn:#9a6413;--warn-soft:#fbeed6;--bad:#a93a2f;--bad-soft:#fae6e3;
  color-scheme:light;
}
*{box-sizing:border-box}
/* Gölge kökte <body> yok; yazı ayarı kâğıdın kendisinde. */
.kok{color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;line-height:1.4}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
select,input,button{font:inherit}
.sheet{max-width:1000px;margin:18px auto;padding:0 14px 60px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  padding:26px 30px 34px;margin-bottom:16px;position:relative}
/* ÜRÜN ALTLIĞI (2 Kasım 2026). Her rapor sayfasının altında Collarlog
   yazıyor. Arka plan görseli DEĞİL bilerek yazı: tarayıcılar yazdırırken
   arka planları varsayılan olarak basmıyor, altlık da kâğıtta kaybolurdu.
   Üstteki antet müşterinin firma logosu — o kiracıya ait, dokunulmuyor. */
.page::after{content:"Collarlog";position:absolute;right:30px;bottom:12px;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);opacity:.7}
.page h2{font-size:20px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:4px}
.page .sub{font-size:11px;color:var(--ink-3);margin-bottom:14px}

/* --- firma anteti --- */
.antet{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--accent);
  padding-bottom:8px;margin:0 0 14px}
.antet img{height:34px;width:auto;max-width:150px;object-fit:contain}
.antet .ad{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;
  letter-spacing:.03em;line-height:1.1;}
.antet .sag{margin-left:auto;font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.35}
.kapak{text-align:center;padding:70px 30px}
.kapak img{max-width:320px;max-height:230px;width:auto;height:auto;object-fit:contain}
.kapak h1{font-size:34px;margin-top:18px}
.kapak .ay{font-size:22px;color:var(--accent);font-weight:600;margin-top:6px}
.kapak .meta{margin-top:26px;font-size:13px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:var(--accent-soft);color:var(--ink);text-align:right;padding:5px 6px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
th:first-child{text-align:left}
td{padding:4px 6px;border:1px solid var(--line-soft);text-align:right;white-space:nowrap}
td:first-child{text-align:left;color:var(--ink-2)}
tfoot td{font-weight:600;background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* TELEFON: sayfa A4 icin tasarlandi, telefonda OKUNMASI hedef degil —
   bozuk gorunmemesi hedef (38. dosya, 6. bulgu; Tayfun'un (a) secimi).
   Tablolar kendi icinde kayar, sayfanin kendisi yatay kaymaz. */
.tablo-kaydir{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.grid2>*{min-width:0}
@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .sheet{padding:0 10px 60px}
  .page{padding:16px 12px}
}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.bar{display:grid;grid-template-columns:120px 1fr 78px;gap:8px;align-items:center;font-size:11.5px}
.track{background:var(--line-soft);height:11px;border-radius:2px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--accent)}
.track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:#b3701a}
.bar .val{text-align:right;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}
.chart{width:100%;height:170px;display:block}
.chart text{font-size:9px;fill:var(--ink-3)}
.chart .grid-line{stroke:var(--line-soft)}
.chart .avgline{stroke:#b3701a;stroke-width:1.4;stroke-dasharray:4 3}
.pgrid td.c{width:16px;padding:3px 0;text-align:center;font-size:9px;color:#123}
.c-calisti{background:var(--ok)}
.c-tek{background:var(--ok);color:#fff;font-weight:700}
.c-izin{background:var(--izin)}
.c-rapor{background:var(--rapor)}
.c-ucretsiz_izin{background:var(--ucretsiz)}
.c-bayram{background:var(--bayram)}
.c-ozel_durum{background:var(--ozel)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px}
.tile .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:24px}
.msg{padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:#0b4d64;font-size:12.5px}
.msg.err{background:#fae5e2;color:#a93a2f}
.hint{font-size:11px;color:var(--ink-3)}
[hidden]{display:none!important}
/* ÖNİZLEME (yalnız ekran): sayfa A4 genişliğinde ve baskıdaki iç
   boşlukla — ekranda görünen düzen kâğıttakinin aynısı. Kabuğun buz
   mavisi zemininde beyaz kâğıtlar. */
@media screen{
  .sheet{max-width:none;margin:0;padding:0 0 40px}
  .page{width:210mm;min-height:297mm;margin:0 auto 18px;padding:14mm 12mm;
        border:0;border-radius:2px;box-shadow:0 1px 3px rgba(13,31,43,.12),0 8px 24px rgba(13,31,43,.10)}
  /* Baskıya özel kurallar önizlemede de — yoksa A4'e sınırda duran bir
     bölüm ekranda taşıp kâğıtta sığıyor, sayfa sayısı yanlış çıkıyordu
     (Hanönü Nisan: önizleme 34, PDF 31). */
  .antet{margin-bottom:10px}
  .tablo-kaydir{overflow:visible;max-width:none}
}
@media print{
  /* Kaydirma kabi kagitta yok sayilir: A4 ciktisi birebir eskisi gibi. */
  .tablo-kaydir{overflow:visible;max-width:none}
  .sheet{max-width:none;margin:0;padding:0}
  .page{border:0;border-radius:0;margin:0;padding:14mm 12mm;break-after:page}
  .page:last-child{break-after:auto}
  .antet{margin-bottom:10px}
}
</style>
</template>
</head>
<body>

<div id="sp-icerik">
  <div class="card filters" id="rapor-secim">
    <div class="row">
      <div class="field grow"><label for="f-project">Şantiye</label>
        <select id="f-project"><option value="">— şantiye seçin —</option></select></div>
      <div class="field"><label for="f-year">Yıl</label><select id="f-year"></select></div>
      <div class="field"><label for="f-month">Ay</label><select id="f-month"></select></div>
      <button class="btn" id="btn-load" type="button">Önizle</button>
      <button class="btn gh" id="btn-print" type="button" disabled>PDF olarak indir</button>
    </div>
  </div>
  <div class="card" id="secim-yok"><div class="note">Raporu görmek için şantiye ve ay seçin.</div></div>
  <div class="sechead" id="onizleme-bas" hidden><h2 id="o-baslik"></h2><span id="o-sayfa"></span></div>
  <div id="onizleme"><div id="out"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app-shell.js?v=67"></script>
<script>
(function(){
"use strict";
if(location.protocol === "file:"){
  document.body.insertAdjacentHTML("beforeend",
    '<div class="wrap"><div class="card"><div class="msg err">' +
    '<b>Bu sayfa bilgisayardaki bir dosyadan açılmış.</b><br>' +
    'Tarayıcı, dosyadan açılan sayfaların sunucuya bağlanmasına güvenlik gereği izin vermez; ' +
    'giriş yapmayı denerseniz "Failed to fetch" hatası alırsınız.<br><br>' +
    'Dosyaları siteye yükleyip <b>https://</b> ile başlayan adresten açın.' +
    '</div></div></div>');
  return;
}

var $=function(s){return document.querySelector(s);};
var tl=function(n,d){ d=(d===undefined?2:d); return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); };
var money=function(n){ return "₺"+Number(n||0).toLocaleString("tr-TR",{maximumFractionDigits:0}); };
var AYLAR=["OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
var AY3=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;"})[c];}); }

var sb=null, MASTER=null, ERISIM={};

/* Giriş, oturum ve YETKİ artık kabukta (SP.boot): eskiden bu sayfanın
   kendi giriş ekranı ve kendi yetki kapısı vardı (38. dosya, 7. bulgu);
   kabuğun kapısı aynı işi yapıyor ve reddedileni doğru sayfaya
   yolluyor. */
function sayfaVar(k){ return !!(ERISIM.sayfalar && ERISIM.sayfalar[k]); }

/* Rapor kâğıdı gölge kökte — app.css içeri sızmasın (baştaki not). */
var KAP = document.getElementById("out");
var KOK = KAP.attachShadow({mode:"open"});
KOK.appendChild(document.getElementById("rapor-stil").content.cloneNode(true));
var OUT = document.createElement("div");
OUT.className = "kok sheet";
KOK.appendChild(OUT);

/* Ay adları Türkçe küçük harfle: düz toLowerCase() "KASIM"ı "Kasim",
   "NİSAN"ı "Ni̇san" yapıyordu (116. dosya). */
function ayAdi(i){ return AYLAR[i][0] + AYLAR[i].slice(1).toLocaleLowerCase("tr"); }

/* Önizleme ölçeği: A4 kâğıt (210 mm ≈ 794 px) içerik alanına sığsın. */
function olcekle(){
  var w = document.getElementById("onizleme").clientWidth;
  var o = Math.min(1, Math.max(.4, (w - 8) / 794));
  KAP.style.setProperty("--onizleme-olcek", String(Math.round(o * 1000) / 1000));
}
window.addEventListener("resize", olcekle);

/* Kaç KÂĞIT çıkacak. Bölüm sayısı değil:
   · uzun bir bölüm ikinci kâğıda taşıyor (Hanönü Ağustos: 22 bölüm, 27 kâğıt)
   · bir tablo kâğıttan GENİŞSE Chrome bütün raporu küçülterek basıyor
     (Hanönü Nisan: %77) ve sınırdaki bölümler tek kâğıda sığıyor.
   Chrome'un yaptığı taklit ediliyor: taşan genişlikte yeniden diz, o
   genişliği kâğıda oranla, yükseklikleri o oranla say. */
function kagitSayisi(){
  var A4Y = 297 * 96 / 25.4, A4G = 210 * 96 / 25.4;
  var sayfalar = Array.prototype.slice.call(OUT.querySelectorAll(".page"));
  var gen = A4G;
  sayfalar.forEach(function(p){ gen = Math.max(gen, p.scrollWidth); });
  var eskiGen = [];
  if(gen > A4G + 1) sayfalar.forEach(function(p, i){ eskiGen[i] = p.style.width; p.style.width = gen + "px"; });
  var oran = A4G / gen, n = 0;
  sayfalar.forEach(function(p){ n += Math.max(1, Math.ceil((p.scrollHeight * oran - 2) / A4Y)); });
  if(gen > A4G + 1) sayfalar.forEach(function(p, i){ p.style.width = eskiGen[i]; });
  return n;
}

function secimYok(){
  $("#secim-yok").hidden = false;
  $("#onizleme-bas").hidden = true;
  $("#btn-print").disabled = true;
  OUT.innerHTML = "";
}

/* PDF olarak indir — tarayıcının kendi PDF motoru (Tayfun'un kararı,
   116. dosya): yazı seçilebilir, keskin, dosya küçük, ekrandakinin
   aynısı. Kaydetme penceresinde dosya adı hazır gelsin diye belge
   başlığı geçici olarak rapora göre ayarlanıyor. */
function dosyaAdi(){
  var tr = {"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","Ç":"C","Ğ":"G","İ":"I","Ö":"O","Ş":"S","Ü":"U"};
  var sel = $("#f-project");
  var saha = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
  saha = saha.replace(/\s*Şantiyesi\s*$/i, "");
  var ay = ayAdi(Number($("#f-month").value) - 1);
  return [saha, ay, $("#f-year").value, "Ozet", "Raporu"].join("-")
    .replace(/[çğıöşüÇĞİÖŞÜ]/g, function(c){ return tr[c]; })
    .replace(/[^A-Za-z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
}
$("#btn-print").addEventListener("click", function(){
  if(this.disabled) return;
  var eski = document.title;
  document.title = dosyaAdi();
  var geri = function(){ document.title = eski; window.removeEventListener("afterprint", geri); };
  window.addEventListener("afterprint", geri);
  window.print();
  setTimeout(geri, 1500);
});
$("#btn-load").addEventListener("click", load);
$("#f-project").addEventListener("change", function(){ if(!this.value) secimYok(); });

SP.boot({sayfa:"rapor", baslik:"Aylık rapor", hazir:function(erisim){
  sb = SP.sb; ERISIM = erisim || {};
  boot();
}});

var FIRMA = "", LOGO = "logo.png", MARK = "logo-mark.png";
function logoImg(cls){
  return '<img src="'+LOGO+'" alt="" '+(cls?'class="'+cls+'" ':'')+
         'onerror="this.onerror=null;this.src=\'icon.svg\'">';
}
function antet(sagYazi){
  return '<div class="antet"><img src="'+MARK+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'">' +
         '<div class="ad">'+esc(FIRMA)+'</div>'+
         (sagYazi?'<div class="sag">'+sagYazi+'</div>':'')+'</div>';
}

function boot(){
  sb.rpc("bootstrap_data").then(function(r){
    if(r.error){ OUT.innerHTML = '<div class="page"><div class="msg err">'+esc(r.error.message)+'</div></div>'; return; }
    MASTER = r.data;
    FIRMA = (MASTER.tenant && MASTER.tenant.name) ? MASTER.tenant.name : "";
    if(MASTER.tenant && MASTER.tenant.branding && MASTER.tenant.branding.logo)
      LOGO = MASTER.tenant.branding.logo;
    var sel = $("#f-project");
    (MASTER.projects||[]).forEach(function(p){
      var o=document.createElement("option"); o.value=p.id; o.textContent=(p.site_name||p.name); sel.appendChild(o); });
    var now=new Date(), ys=$("#f-year");
    for(var y=now.getFullYear()+1; y>=now.getFullYear()-3; y--){ var o=document.createElement("option"); o.value=y; o.textContent=y; ys.appendChild(o); }
    ys.value = now.getFullYear();
    var ms=$("#f-month");
    AYLAR.forEach(function(a,i){ var o=document.createElement("option"); o.value=i+1; o.textContent=ayAdi(i); ms.appendChild(o); });
    ms.value = now.getMonth()+1;
    /* Açılınca HİÇBİR ŞEY çizilmiyor — seçim yapılana kadar. Tek istisna
       Genel bakış'taki "Aylık rapor" düğmesi: şantiye ve ayı adresle
       gönderiyor (rapor.html#şantiye|yıl|ay); seçim zaten yapılmış,
       önizleme doğrudan açılıyor. */
    var h = decodeURIComponent((location.hash||"").replace(/^#/,"")).split("|");
    var secili = false;
    if(h.length >= 2 && h[0]){
      if(Array.prototype.some.call(sel.options, function(o){ return o.value === h[0]; })){
        sel.value = h[0]; secili = true; }
      if(h[1]) ys.value = h[1];
      if(h[2]) ms.value = h[2];
    }
    if(secili) load(); else secimYok();
  });
}

function load(){
  var proj=$("#f-project").value, y=Number($("#f-year").value), m=Number($("#f-month").value);
  if(!proj){ secimYok(); return; }
  $("#secim-yok").hidden = true;
  $("#btn-print").disabled = true;
  olcekle();
  OUT.innerHTML = '<div class="page"><div class="msg">Rapor hazırlanıyor…</div></div>';
  /* Prim cetveli kisi kisi TUTAR gosteriyor; yalniz maas/bordro yetkisi
     olan roller gorur. Yetki yoksa cagri hic yapilmiyor. */
  var primVar = sayfaVar("maaslar");
  Promise.all([
    sb.rpc("report_month", {p_project:proj, p_year:y, p_month:m}),
    sb.rpc("report_charts", {p_project:proj, p_year:y, p_month:m}),
    primVar ? sb.rpc("bonus_report", {p_project:proj, p_month:y+"-"+String(m).padStart(2,"0")+"-01"})
            : Promise.resolve({data:null, error:null})
  ]).then(function(res){
    var a=res[0], b=res[1], c=res[2];
    if(a.error||b.error){ OUT.innerHTML='<div class="page"><div class="msg err">'+esc((a.error||b.error).message)+'</div></div>'; return; }
    render(a.data, b.data, (c && !c.error) ? c.data : null, y, m);
  });
}

/* ---------- çizim ---------- */
function hbars(rows, key, unit, avg){
  if(!rows||!rows.length) return '<div class="hint">Veri yok.</div>';
  var max = Math.max.apply(null, rows.map(function(x){ return Number(x[key]); }));
  if(avg) max = Math.max(max, avg); max = max||1;
  return '<div class="bars">' + rows.map(function(x){
    return '<div class="bar"><span>'+esc(x.name||x.ad||x.program)+'</span><span class="track"><i style="width:'+
      Math.max(1.5,Number(x[key])/max*100)+'%"></i>'+(avg?'<span class="avg" style="left:'+(avg/max*100)+'%"></span>':'')+
      '</span><span class="val num">'+tl(x[key])+' '+unit+'</span></div>';
  }).join("") + '</div>' + (avg ? '<div class="legend"><span><i style="background:#b3701a"></i>Ortalama '+tl(avg)+' m</span></div>' : '');
}
function vbars(rows, opts){
  opts=opts||{};
  if(!rows||!rows.length) return '<div class="hint">Veri yok.</div>';
  var W=700,H=170,padL=40,padR=8,padT=12,padB=24;
  var vals=[]; rows.forEach(function(r){ vals.push(Number(r.a)||0); if(opts.two) vals.push(Number(r.b)||0); });
  var max=Math.max.apply(null,vals)||1, step=(W-padL-padR)/rows.length, n=opts.two?2:1;
  var bw=Math.max(2,Math.min(opts.two?12:24,(step-5)/n));
  var o=['<svg class="chart" viewBox="0 0 '+W+' '+H+'">'];
  [0,max/2,max].forEach(function(t){
    var yy=padT+(H-padT-padB)*(1-t/max);
    o.push('<line class="grid-line" x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'"/>');
    o.push('<text x="'+(padL-5)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+tl(t,0)+'</text>');
  });
  if(opts.avg){ var ya=padT+(H-padT-padB)*(1-opts.avg/max);
    o.push('<line class="avgline" x1="'+padL+'" y1="'+ya.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ya.toFixed(1)+'"/>'); }
  rows.forEach(function(r,i){
    var x0=padL+i*step+(step-bw*n-(opts.two?2:0))/2;
    [["a","#12708f"],["b","#7fb9cd"]].slice(0,n).forEach(function(sr,k){
      var v=Number(r[sr[0]])||0, h=(H-padT-padB)*(v/max), x=x0+k*(bw+2), yy=H-padB-h;
      o.push('<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" fill="'+sr[1]+'"/>');
    });
    if(rows.length<=16 || i%3===0)
      o.push('<text x="'+(padL+i*step+step/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(r.short||r.label)+'</text>');
  });
  o.push('</svg>');
  return o.join("") + (opts.two ? '<div class="legend"><span><i style="background:#12708f"></i>'+esc(opts.aLabel)+
    '</span><span><i style="background:#7fb9cd"></i>'+esc(opts.bLabel)+'</span></div>' : '');
}
function tbl(cols, rows, foot){
  /* Tablolar nowrap; dar ekranda SAYFA degil tablonun KENDISI kaysin diye
     kaydirma kabina aliniyor. @media print'te kap seffaf (overflow:visible),
     A4 ciktisi degismiyor. */
  return '<div class="tablo-kaydir"><table><thead><tr>'+cols.map(function(c){return '<th>'+c[0]+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+c[1](r)+'</td>'; }).join("")+'</tr>'; }).join("")+
    '</tbody>'+(foot?'<tfoot><tr>'+foot+'</tr></tfoot>':'')+'</table></div>';
}
var DURUM={bitti:"Bitti",matris_doktu:"Matris döktü",kullanilir:"Kullanılır",stokta:"Stokta"};
var WSTAT={drilling:"Devam",completed:"Bitti",cancelled:"İptal",planned:"Planlı"};
var PROG={arama:"Maden arama",planlama:"Maden planlama"};
var GOREV={formen:"Formen", yardimci:"Yardımcı personel", santiye_sefi:"Ş. şefi",sondor:"Sondör",sondor_yardimcisi:"Sondör yrd.",alt_eleman:"Alt eleman",sofor:"Şoför",destek:"Destek",diger:"Diğer"};

function render(d, c, prim, y, m){
  var P = [];
  var ayad = AYLAR[m-1] + "-" + y;
  var proje = d.project || {};
  var o = d.ozet;

  /* kapak */
  P.push('<div class="page kapak">'+logoImg()+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:23px;font-weight:700;letter-spacing:.03em;margin-top:10px">'+
    esc(FIRMA)+'</div>' +
    '<h1 style="margin-top:22px">'+esc(proje.site||proje.name)+'</h1>' +
    '<div style="font-size:15px;color:var(--ink-2);margin-top:4px">'+esc(proje.name)+'</div>' +
    '<div class="ay">'+ayad+' ÖZET RAPORU</div>' +
    '<div class="meta">Delinen metraj <b>'+tl(o.delgi)+' m</b> · Teslim edilen <b>'+tl(o.teslim)+' m</b> · ' +
    o.biten_kuyu+' kuyu tamamlandı<br>'+o.vardiya+' vardiya kaydı · '+o.personel+' personel</div>' +
    '<div class="meta hint" style="margin-top:34px">Bu rapor saha kayıtlarından otomatik üretilmiştir.</div></div>');

  /* özet + grafikler */
  P.push('<div class="page">'+antet(ayad)+'<h2>Ay özeti</h2><div class="sub">'+ayad+'</div>' +
    '<div class="tiles">' +
    [['Delinen metraj',tl(o.delgi)+' m'],['Teslim edilen',tl(o.teslim)+' m'],['İptal kuyu',tl(o.iptal)+' m'],
     ['Biten kuyu',o.biten_kuyu],['Vardiya',o.vardiya],['Yakıt',tl(d.yakit.toplam_litre,0)+' lt']]
      .map(function(t){ return '<div class="tile"><div class="k">'+t[0]+'</div><div class="v num">'+t[1]+'</div></div>'; }).join("") +
    '</div>' +
    '<div class="grid2" style="margin-top:14px">' +
      '<div><h3>Makine delgi grafiği</h3>' + vbars((c.makine||[]).map(function(r){return {label:r.name,a:r.metraj};}),
        {avg:c.makine_ortalama}) + '</div>' +
      '<div><h3>Sahalara göre delgi</h3>' + hbars((c.saha||[]).map(function(r){
        return {name:PROG[r.program]||r.program, metraj:r.metraj}; }), "metraj", "m") + '</div>' +
    '</div>' +
    '<div style="margin-top:14px"><h3>Aylara göre metraj ('+y+')</h3>' +
      vbars((c.aylik||[]).map(function(r){ return {label:AY3[r.ay-1], a:r.delgi, b:r.teslim}; }),
        {two:true, aLabel:"Delinen", bLabel:"Teslim edilen"}) + '</div></div>');

  /* sondör haftalık */
  var hw = c.haftalik||[];
  P.push('<div class="page">'+antet(ayad)+'<h2>Sondör ilerleme çizelgesi</h2><div class="sub">'+ayad+' · iptal edilen kuyular hariç</div>' +
    tbl([["Sondör",function(r){return esc(r.name);}],
         ["1–7",function(r){return Number(r.h1)?tl(r.h1):"—";}],
         ["8–15",function(r){return Number(r.h2)?tl(r.h2):"—";}],
         ["16–22",function(r){return Number(r.h3)?tl(r.h3):"—";}],
         ["23–31",function(r){return Number(r.h4)?tl(r.h4):"—";}],
         ["Toplam",function(r){return "<b>"+tl(r.toplam)+"</b>";}]], hw,
        hw.length ? '<td>Toplam</td><td colspan="4"></td><td>'+tl(hw.reduce(function(s,x){return s+Number(x.toplam);},0))+'</td>' : null) +
    '<div style="margin-top:14px"><h3>Sondör delgi grafiği</h3>' +
    hbars(hw.map(function(r){ return {name:r.name, toplam:r.toplam}; }), "toplam", "m") + '</div></div>');

  /* kuyu bilgileri */
  var kuy = d.kuyular||[];
  P.push('<div class="page">'+antet(ayad)+'<h2>Kuyu bilgileri</h2><div class="sub">'+ayad+'</div>' +
    tbl([["Kuyu",function(r){return esc(r.code);}],
         ["Program",function(r){return PROG[r.program]||"—";}],
         ["Makine",function(r){return esc(r.makine||"—");}],
         ["Başlangıç",function(r){return r.baslangic||"—";}],
         ["Bitiş",function(r){return r.bitis||"—";}],
         ["Eğim",function(r){return r.dip==null?"—":tl(r.dip,0)+"°";}],
         ["Ölçüm",function(r){return r.olcum;}],
         ["PQ",function(r){return Number(r.pq)?tl(r.pq):"—";}],
         ["HQ",function(r){return Number(r.hq)?tl(r.hq):"—";}],
         ["NQ",function(r){return Number(r.nq)?tl(r.nq):"—";}],
         ["Taban",function(r){return "<b>"+tl(r.taban)+"</b>";}],
         ["Durum",function(r){return WSTAT[r.status]||r.status;}]], kuy) +
    '<div style="margin-top:14px"><h3>Biten kuyular</h3>' +
    tbl([["Kuyu",function(r){return esc(r.code);}],["Makine",function(r){return esc(r.makine||"—");}],
         ["Program",function(r){return PROG[r.program]||"—";}],
         ["Derinlik",function(r){return tl(r.derinlik)+" m";}],["Bitiş",function(r){return r.bitis;}]],
        c.biten_kuyular||[],
        (c.biten_kuyular||[]).length ? '<td>Toplam</td><td colspan="2"></td><td>'+
          tl((c.biten_kuyular||[]).reduce(function(s,x){return s+Number(x.derinlik);},0))+' m</td><td></td>' : null) +
    '</div></div>');

  /* makine bazlı günlük metraj */
  (d.makine_gunluk||[]).forEach(function(mg){
    var sondorler = [];
    (mg.gunler||[]).forEach(function(g){ Object.keys(g.sondorler||{}).forEach(function(k){
      if(sondorler.indexOf(k) === -1) sondorler.push(k); }); });
    var cols = [["Tarih", function(r){ return r.tarih; }]];
    sondorler.forEach(function(sn){ cols.push([sn, function(r){
      var v = r.sondorler && r.sondorler[sn]; return v ? tl(v) : "—"; }]); });
    cols.push(["Günlük", function(r){ return "<b>"+tl(r.gunluk)+"</b>"; }]);
    cols.push(["Kuyu derinliği", function(r){ return tl(r.derinlik); }]);
    cols.push(["Çap", function(r){ return esc(r.cap||""); }]);
    cols.push(["Kuyu", function(r){ return esc(r.kuyu||""); }]);
    var toplamlar = '<td>Toplam</td>' + sondorler.map(function(sn){
      var t = (mg.gunler||[]).reduce(function(s,g){ return s + Number((g.sondorler||{})[sn]||0); },0);
      return '<td>'+tl(t)+'</td>'; }).join("") + '<td>'+tl(mg.toplam)+'</td><td colspan="3"></td>';
    P.push('<div class="page">'+antet(ayad)+'<h2>'+esc(mg.makine)+' metraj çizelgesi</h2><div class="sub">'+ayad+'</div>' +
      tbl(cols, mg.gunler||[], toplamlar) + '</div>');
  });

  /* yıllık sondör */
  var yr = c.yillik||[];
  var ycols = [["Sondör", function(r){ return esc(r.name); }]];
  for(var i=1;i<=12;i++){ (function(mm){ ycols.push([AY3[mm-1], function(r){
    var v = r.aylar && r.aylar[String(mm)]; return v ? tl(v,0) : "—"; }]); })(i); }
  ycols.push(["Toplam", function(r){ return "<b>"+tl(r.toplam,0)+"</b>"; }]);
  P.push('<div class="page">'+antet(ayad)+'<h2>Yıllık sondör metrajları</h2><div class="sub">'+y+'</div>' + tbl(ycols, yr) + '</div>');

  /* puantaj */
  var pu = d.puantaj||[];
  var gunSay = new Date(y, m, 0).getDate();
  var head = '<tr><th style="text-align:left">Ad Soyad</th><th>Görev</th>';
  for(var g=1; g<=gunSay; g++) head += '<th style="text-align:center;padding:3px 0">'+g+'</th>';
  head += '<th>Aktif</th><th>İzin</th><th>Rapor</th><th>Tek</th><th>Avans</th></tr>';
  var body = pu.map(function(r){
    var tds = '<td>'+esc(r.name)+'</td><td>'+(GOREV[r.gorev]||r.gorev)+'</td>';
    for(var g=1; g<=gunSay; g++){
      var st = r.gunler ? r.gunler[String(g)] : null;
      tds += '<td class="c '+(st?("c-"+st):"")+'">'+(st==="tek"?"T":(st==="rapor"?"R":""))+'</td>';
    }
    tds += '<td>'+r.aktif+'</td><td>'+r.izin+'</td><td>'+r.rapor+'</td><td>'+r.tek+'</td><td>'+
      (Number(r.avans)?money(r.avans):"—")+'</td>';
    return '<tr>'+tds+'</tr>';
  }).join("");
  P.push('<div class="page">'+antet(ayad)+'<h2>Puantaj tablosu</h2><div class="sub">'+ayad+'</div>' +
    '<div class="tablo-kaydir"><table class="pgrid"><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="8">Kayıt yok.</td></tr>')+'</tbody></table></div>' +
    '<div class="legend"><span><i class="c-calisti" style="background:var(--ok)"></i>Çalıştı</span>' +
    '<span><i style="background:var(--izin)"></i>İzin</span><span><i style="background:var(--rapor)"></i>Rapor (R)</span>' +
    '<span><i style="background:var(--ucretsiz)"></i>Ücretsiz izin</span><span><i style="background:var(--bayram)"></i>Bayram</span>' +
    '<span><i style="background:var(--ozel)"></i>Özel durum</span><span><i style="background:var(--ok)"></i>T = tek çalışma</span></div></div>');

  /* prim */
  if(prim){
    P.push('<div class="page">'+antet(ayad)+'<h2>Prim cetveli</h2><div class="sub">'+ayad+
      (prim.threshold ? ' · baraj '+tl(prim.threshold)+' m (çarpanlı)' : ' · baraj tanımlı değil')+'</div>' +
      '<div class="grid2"><div><h3>Sondör</h3>' +
      tbl([["Ad",function(r){return esc(r.name);}],["Metraj",function(r){return tl(r.meters);}],
           ["Çarpanlı",function(r){return "<b>"+tl(r.weighted)+"</b>";}],
           ["Durum",function(r){return r.over?"Baraj aşıldı":"—";}]], prim.drillers||[]) +
      '</div><div><h3>Makine</h3>' +
      tbl([["Makine",function(r){return esc(r.name);}],["Metraj",function(r){return tl(r.meters);}],
           ["Çarpanlı",function(r){return "<b>"+tl(r.weighted)+"</b>";}],
           ["Durum",function(r){return r.over?"Baraj aşıldı":"—";}]], prim.machines||[]) +
      '</div></div></div>');
  }

  /* matkap */
  P.push('<div class="page">'+antet(ayad)+'<h2>Matkap takibi</h2><div class="sub">'+ayad+'</div>' +
    tbl([["Makine",function(r){return esc(r.makine);}],["Çap",function(r){return esc(r.cap);}],
         ["Marka",function(r){return esc(r.marka);}],["Kuyu",function(r){return esc(r.kuyu||"—");}],
         ["Giriş",function(r){return tl(r.giris);}],["Çıkış",function(r){return tl(r.cikis);}],
         ["Metre",function(r){return "<b>"+tl(r.metre)+"</b>";}],
         ["Tarih",function(r){return r.tarih;}],["Durum",function(r){return DURUM[r.durum]||r.durum;}]],
        d.matkap||[],
        (d.matkap||[]).length ? '<td colspan="6">Toplam</td><td>'+
          tl((d.matkap||[]).reduce(function(s,x){return s+Number(x.metre||0);},0))+'</td><td colspan="2"></td>' : null) +
    '</div>');

  /* yakıt */
  var yk = d.yakit;
  var gruplar = {};
  (yk.satirlar||[]).forEach(function(r){ (gruplar[r.grup] = gruplar[r.grup] || []).push(r); });
  var yakitSayfa = '<div class="page">'+antet(ayad)+'<h2>Yakıt ve petrol harcama takibi</h2><div class="sub">'+ayad+'</div>' +
    '<h3>Özet</h3>' + tbl([["Makine / araç",function(r){return esc(r.grup);}],
      ["Litre",function(r){return tl(r.litre);}],["Tutar",function(r){return money(r.tutar);}]], yk.ozet||[],
      '<td>Toplam</td><td>'+tl(yk.toplam_litre)+'</td><td>'+money(yk.toplam_tutar)+'</td>') +
    '<div style="margin-top:12px"><h3>Dağılım</h3>' +
    hbars((yk.ozet||[]).map(function(r){ return {name:r.grup, tutar:r.tutar}; }), "tutar", "₺") + '</div></div>';
  P.push(yakitSayfa);

  Object.keys(gruplar).forEach(function(gr){
    P.push('<div class="page">'+antet(ayad)+'<h2>'+esc(gr)+' yakıt kayıtları</h2><div class="sub">'+ayad+'</div>' +
      tbl([["Tarih",function(r){return r.tarih;}],["Litre",function(r){return tl(r.litre);}],
           ["Cins",function(r){return esc(r.cins);}],["Araç",function(r){return esc(r.arac||"—");}],
           ["Alan kişi",function(r){return esc(r.alan||"—");}],["Tutar",function(r){return money(r.tutar);}]],
          gruplar[gr],
          '<td>Toplam</td><td>'+tl(gruplar[gr].reduce(function(s,x){return s+Number(x.litre||0);},0))+
          '</td><td colspan="3"></td><td>'+money(gruplar[gr].reduce(function(s,x){return s+Number(x.tutar||0);},0))+'</td>') +
      '</div>');
  });

  OUT.innerHTML = P.join("");
  /* Önizleme başlığı: hangi rapor, kaç sayfa. İndirme düğmesi ancak
     şimdi açılıyor — önizlenmemiş rapor indirilmiyor. */
  var sel = $("#f-project");
  $("#o-baslik").textContent = (sel.options[sel.selectedIndex] || {}).textContent || "";
  $("#o-sayfa").textContent = ayAdi(m - 1) + " " + y + " · " + kagitSayisi() + " sayfa";
  $("#onizleme-bas").hidden = false;
  $("#btn-print").disabled = false;
  olcekle();
}
})();
</script>
</body>
