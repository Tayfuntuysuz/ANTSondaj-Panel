<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sondaj Raporu · İşveren</title>
<meta name="theme-color" content="#123146">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
@media print{ .tabs,.no-print{display:none!important} }
</style>
</head>
<body>


<div id="sp-icerik">

  <div id="scr-main">
    <div class="antet" id="antet"></div>
    <div class="card no-print">
      <div class="row">
        <div class="field" style="flex:1;min-width:200px"><label>Saha / proje</label><select id="f-proj"></select></div>
      </div>
      <div id="msg"></div>
    </div>

    <div class="tabs" id="tabs">
      <button data-t="gun" class="on">Günlük rapor</button>
      <button data-t="donem">Dönem raporu</button>
      <button data-t="foto">Fotoğraflar</button>
    </div>

    <!-- GÜNLÜK -->
    <section data-p="gun">
      <div class="card no-print">
        <div class="row">
          <div class="field"><label>Tarih</label><input id="g-date" type="date"></div>
          <button class="btn" id="btn-gun" type="button">Getir</button>
          <button class="btn ghost" id="btn-gun-dun" type="button">Önceki gün</button>
          <button class="btn ghost" id="btn-gun-yaz" type="button">Yazdır / PDF</button>
        </div>
      </div>
      <div id="gun-out"></div>
    </section>

    <!-- DÖNEM -->
    <section data-p="donem" hidden>
      <div class="card no-print">
        <div class="row">
          <div class="field"><label>Başlangıç</label><input id="d-from" type="date"></div>
          <div class="field"><label>Bitiş</label><input id="d-to" type="date"></div>
          <button class="btn" id="btn-donem" type="button">Getir</button>
          <button class="btn ghost" id="btn-d-ay" type="button">Bu ay</button>
          <button class="btn ghost" id="btn-d-excel" type="button">Excel (CSV)</button>
          <button class="btn ghost" id="btn-d-yaz" type="button">Yazdır / PDF</button>
        </div>
      </div>
      <div id="donem-out"></div>
    </section>

    <!-- FOTO -->
    <section data-p="foto" hidden>
      <div class="card no-print">
        <div class="row">
          <div class="field"><label>Başlangıç</label><input id="p-from" type="date"></div>
          <div class="field"><label>Bitiş</label><input id="p-to" type="date"></div>
          <button class="btn" id="btn-foto" type="button">Getir</button>
        </div>
        <div id="p-msg"></div>
      </div>
      <div class="card"><div class="gal" id="foto-out"></div></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var tl=function(n,d){ d=(d===undefined?2:d); return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
function msg(el,t,k){ el.innerHTML = t ? '<div class="msg '+(k||"")+'">'+t+'</div>' : ""; }
function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function trd(s){ if(!s) return "—"; var p=String(s).slice(0,10).split("-"); return p[2]+"."+p[1]+"."+p[0]; }
var VARD={gunduz:"Gündüz", gece:"Gece"};
var KDURUM={planned:"Planlandı", drilling:"Devam ediyor", completed:"Tamamlandı", cancelled:"İptal"};
var PROGRAM={arama:"Maden arama", planlama:"Maden planlama"};

var sb=null, BOOT=null, DONEM=null;

SP.boot({sayfa:"isveren", baslik:"Raporlarım", hazir:function(){
  sb = SP.sb;
  boot();
}});

$$("#tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    $$("#tabs button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    $$("section[data-p]").forEach(function(s){ s.hidden = (s.dataset.p !== b.dataset.t); });
  });
});

function boot(){
  var d=new Date(); d.setDate(d.getDate()-1);
  $("#g-date").value=iso(d);
  var first=new Date(); first.setDate(1);
  $("#d-from").value=iso(first); $("#d-to").value=iso(new Date());
  $("#p-from").value=iso(first); $("#p-to").value=iso(new Date());
  sb.rpc("employer_bootstrap").then(function(r){
    if(r.error){ msg($("#msg"), esc(r.error.message), "err"); return; }
    BOOT=r.data;
    var lg = (BOOT.logo || "logo-mark.png");
    $("#antet").innerHTML = '<img src="'+lg+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'">' +
      '<div class="ad">'+esc(BOOT.firma||"")+'</div>' +
      '<div class="sag">'+esc(BOOT.isveren||"")+'</div>';
    var s=$("#f-proj");
    s.innerHTML=(BOOT.projeler||[]).map(function(p){
      return '<option value="'+p.id+'">'+esc(p.ad)+(p.il?' — '+esc(p.il):'')+'</option>'; }).join("");
    if(!(BOOT.projeler||[]).length){ msg($("#msg"), "Hesabınıza tanımlı saha bulunmuyor.", "warn"); return; }
    gun();
  });
}
$("#f-proj").addEventListener("change", function(){ gun(); DONEM=null; $("#donem-out").innerHTML=""; });

function tbl(cols, rows, empty, foot){
  if(!rows || !rows.length) return '<div class="hint">'+empty+'</div>';
  return '<div class="scroll"><table><thead><tr>'+cols.map(function(c){ return '<th>'+c[0]+'</th>'; }).join("")+
    '</tr></thead><tbody>'+rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+c[1](r)+'</td>'; }).join("")+'</tr>'; }).join("")+
    '</tbody>'+(foot?'<tfoot><tr>'+foot+'</tr></tfoot>':'')+'</table></div>';
}
function tiles(list){
  return '<div class="tiles">'+list.map(function(x){
    return '<div class="tile"><div class="k">'+x[0]+'</div><div class="v num">'+x[1]+
      '</div><div class="hint">'+(x[2]||"")+'</div></div>'; }).join("")+'</div>';
}
function barsHtml(rows, key, lbl, fmt){
  if(!rows || !rows.length) return '<div class="hint">Veri yok.</div>';
  var max=Math.max.apply(null, rows.map(function(r){ return Number(r[key])||0; })) || 1;
  return '<div class="bars">'+rows.map(function(r){
    return '<div class="bar"><span>'+esc(r[lbl])+'</span><span class="track"><i style="width:'+
      ((Number(r[key])||0)/max*100)+'%"></i></span><span class="val">'+fmt(r[key])+'</span></div>'; }).join("")+'</div>';
}

// ---------------- GÜNLÜK ----------------
function gun(){
  var pj=$("#f-proj").value; if(!pj) return;
  $("#gun-out").innerHTML='<div class="card"><div class="hint">Yükleniyor…</div></div>';
  sb.rpc("employer_daily", {p_project:pj, p_date:$("#g-date").value}).then(function(r){
    if(r.error){ $("#gun-out").innerHTML='<div class="card"><div class="msg err">'+esc(r.error.message)+'</div></div>'; return; }
    var d=r.data, v=d.vardiyalar||[];
    var h='<div class="card"><h3>'+esc(d.proje||"")+' · '+trd(d.tarih)+'</h3>'+
      '<div class="note">Gece vardiyası, rapor kuralı gereği ertesi güne yazılır.</div>'+
      tiles([["Günün metrajı", tl(d.toplam_metraj)+' <small>m</small>'],
             ["Vardiya", String(v.length)],
             ["Mazot", tl(d.toplam_mazot,0)+' <small>lt</small>']])+'</div>';
    if(!v.length){ h+='<div class="card"><div class="hint">Bu tarihte kayıt bulunmuyor.</div></div>'; }
    v.forEach(function(s){
      h+='<div class="card"><div class="vard"><h4>'+(VARD[s.vardiya]||s.vardiya)+' vardiyası — '+
        esc(s.kuyu)+' · '+esc(s.makine)+(s.form_no?' <span class="hint">form '+esc(s.form_no)+'</span>':'')+'</h4>'+
        '<div class="hint">Kuyu derinliği '+tl(s.kuyu_derinlik)+' m · '+(KDURUM[s.kuyu_durum]||s.kuyu_durum)+
        (s.motor_bas?' · motor '+String(s.motor_bas).slice(0,5)+'–'+String(s.motor_bit||"").slice(0,5):'')+
        ' · vardiya metrajı <b>'+tl(s.metraj)+' m</b>'+(s.olcum?' · '+s.olcum+' ölçüm':'')+'</div>'+
        ((s.ekip||[]).length?'<div class="hint">Ekip: '+(s.ekip||[]).map(esc).join(", ")+'</div>':'')+
        '</div>'+
        tbl([["Sıra",function(x){return x.sira;}],
             ["Çap",function(x){return esc(x.cap);}],
             ["Başlangıç",function(x){return '<span class="num">'+tl(x.baslangic)+'</span>';}],
             ["Bitiş",function(x){return '<span class="num">'+tl(x.bitis)+'</span>';}],
             ["Metre",function(x){return '<span class="num"><b>'+tl(x.metre)+'</b></span>';}],
             ["Sondör",function(x){return esc(x.sondor||"—");}]],
            s.manevralar, "Manevra kaydı yok.") +
        (s["not"]?'<div class="hint" style="margin-top:8px">Not: '+esc(s["not"])+'</div>':'')+
        (s.bitis?'<div class="msg warn" style="margin-top:8px">'+(s.bitis==="kuyu_iptali"?"Kuyu iptal edildi":"Kuyu tamamlandı")+'</div>':'')+
        '</div>';
    });
    $("#gun-out").innerHTML=h;
  });
}
$("#btn-gun").addEventListener("click", gun);
$("#g-date").addEventListener("change", gun);
$("#btn-gun-dun").addEventListener("click", function(){
  var d=new Date($("#g-date").value||new Date()); d.setDate(d.getDate()-1);
  $("#g-date").value=iso(d); gun();
});
$("#btn-gun-yaz").addEventListener("click", function(){ window.print(); });

// ---------------- DÖNEM ----------------
function donem(){
  var pj=$("#f-proj").value; if(!pj) return;
  $("#donem-out").innerHTML='<div class="card"><div class="hint">Yükleniyor…</div></div>';
  sb.rpc("employer_report", {p_project:pj, p_from:$("#d-from").value, p_to:$("#d-to").value}).then(function(r){
    if(r.error){ $("#donem-out").innerHTML='<div class="card"><div class="msg err">'+esc(r.error.message)+'</div></div>'; return; }
    DONEM=r.data; var d=r.data, t=d.toplam||{}, p=d.proje||{};
    var h='<div class="card"><h3>'+esc(p.ad||"")+'</h3>'+
      '<div class="note">'+esc(p.tam_ad||"")+(p.il?' · '+esc(p.il)+(p.ilce?' / '+esc(p.ilce):''):'')+
      ' · '+trd(d.donem.baslangic)+' – '+trd(d.donem.bitis)+'</div>'+
      tiles([["Delinen metraj", tl(t.metraj)+' <small>m</small>', (Number(t.iptal)>0?'iptal '+tl(t.iptal)+' m hariç geçerli '+tl(t.gecerli)+' m':'')],
             ["Çalışılan gün", String(t.gun)],
             ["Kuyu", String(t.kuyu), t.biten+' tamamlandı'],
             ["Ölçüm", String(t.olcum)],
             ["Mazot", tl(t.mazot,0)+' <small>lt</small>']])+'</div>';

    h+='<div class="card"><h3>Günlük metraj</h3>'+
      tbl([["Tarih",function(x){return trd(x.tarih);}],
           ["Metraj",function(x){return '<span class="num">'+tl(x.metraj)+' m</span>';}],
           ["Geçerli",function(x){return '<span class="num">'+tl(x.gecerli)+' m</span>';}],
           ["Makine",function(x){return x.makine;}],
           ["Kuyu",function(x){return x.kuyu;}]],
          d.gunler, "Kayıt yok.",
          '<td>Toplam</td><td class="num">'+tl(t.metraj)+' m</td><td class="num">'+tl(t.gecerli)+
          ' m</td><td></td><td></td>')+'</div>';

    h+='<div class="card"><h3>Kuyu bilgileri</h3>'+
      tbl([["Kuyu",function(x){return '<b>'+esc(x.kuyu)+'</b>';}],
           ["Program",function(x){return PROGRAM[x.program]||esc(x.program||"—");}],
           ["PQ",function(x){return '<span class="num">'+tl(x.pq)+'</span>';}],
           ["HQ",function(x){return '<span class="num">'+tl(x.hq)+'</span>';}],
           ["NQ",function(x){return '<span class="num">'+tl(x.nq)+'</span>';}],
           ["Dönem metrajı",function(x){return '<span class="num"><b>'+tl(x.metraj)+'</b></span>';}],
           ["Kuyu derinliği",function(x){return '<span class="num">'+tl(x.derinlik)+'</span>';}],
           ["Ölçüm",function(x){return x.olcum;}],
           ["İlk–son",function(x){return '<span class="hint">'+trd(x.ilk)+' – '+trd(x.son)+'</span>';}],
           ["Durum",function(x){return '<span class="pill'+(x.durum==="cancelled"?" warn":"")+'">'+(KDURUM[x.durum]||x.durum)+'</span>';}]],
          d.kuyular, "Kayıt yok.")+'</div>';

    h+='<div class="card"><h3>Makine performansı</h3>'+
      tbl([["Makine",function(x){return '<b>'+esc(x.makine)+'</b>';}],
           ["Metraj",function(x){return '<span class="num">'+tl(x.metraj)+' m</span>';}],
           ["Gün",function(x){return x.gun;}],
           ["Günlük ortalama",function(x){return '<span class="num">'+tl(x.gunluk_ort)+' m</span>';}]],
          d.makineler, "Kayıt yok.")+'</div>';

    h+='<div class="card"><h3>Çap dağılımı</h3>'+barsHtml(d.caplar||[], "metraj", "cap",
        function(v){ return tl(v)+" m"; })+'</div>';

    $("#donem-out").innerHTML=h;
  });
}
$("#btn-donem").addEventListener("click", donem);
$("#btn-d-ay").addEventListener("click", function(){
  var f=new Date(); f.setDate(1); $("#d-from").value=iso(f); $("#d-to").value=iso(new Date()); donem();
});
$("#btn-d-yaz").addEventListener("click", function(){ if(!DONEM) donem(); else window.print(); });
$("#btn-d-excel").addEventListener("click", function(){
  if(!DONEM){ donem(); return; }
  var d=DONEM, L=[];
  var q=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  L.push([q(d.proje.ad), q(trd(d.donem.baslangic)+" - "+trd(d.donem.bitis))].join(";"));
  L.push("");
  L.push(["Tarih","Metraj","Gecerli","Makine","Kuyu"].map(q).join(";"));
  (d.gunler||[]).forEach(function(x){ L.push([q(trd(x.tarih)), tl(x.metraj), tl(x.gecerli), x.makine, x.kuyu].join(";")); });
  L.push("");
  L.push(["Kuyu","Program","PQ","HQ","NQ","Donem metraji","Kuyu derinligi","Olcum","Durum"].map(q).join(";"));
  (d.kuyular||[]).forEach(function(x){ L.push([q(x.kuyu), q(PROGRAM[x.program]||x.program||""), tl(x.pq), tl(x.hq),
      tl(x.nq), tl(x.metraj), tl(x.derinlik), x.olcum, q(KDURUM[x.durum]||x.durum)].join(";")); });
  L.push("");
  L.push(["Makine","Metraj","Gun","Gunluk ortalama"].map(q).join(";"));
  (d.makineler||[]).forEach(function(x){ L.push([q(x.makine), tl(x.metraj), x.gun, tl(x.gunluk_ort)].join(";")); });
  L.push("");
  L.push([q("TOPLAM"), tl(d.toplam.metraj)].join(";"));
  var blob=new Blob(["﻿"+L.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(d.proje.ad||"rapor").replace(/[^\wğüşıöçĞÜŞİÖÇ -]/g,"")+" "+d.donem.baslangic+"_"+d.donem.bitis+".csv";
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
});

// ---------------- FOTOĞRAF ----------------
$("#btn-foto").addEventListener("click", function(){
  var pj=$("#f-proj").value; if(!pj) return;
  msg($("#p-msg"), "Yükleniyor…");
  sb.rpc("employer_files", {p_project:pj, p_from:$("#p-from").value, p_to:$("#p-to").value}).then(function(r){
    if(r.error){ msg($("#p-msg"), esc(r.error.message), "err"); return; }
    var list=r.data||[];
    if(!list.length){ msg($("#p-msg"), ""); $("#foto-out").innerHTML='<div class="hint">Bu aralıkta dosya yok.</div>'; return; }
    var paths=list.map(function(x){ return x.yol; }).filter(Boolean);
    sb.storage.from("saha-fotograf").createSignedUrls(paths, 1800).then(function(su){
      msg($("#p-msg"), "");
      var urls={};
      if(!su.error) (su.data||[]).forEach(function(u){ if(u.path) urls[u.path]=u.signedUrl; });
      $("#foto-out").innerHTML = list.map(function(x){
        var u=urls[x.yol];
        return '<a href="'+(u||"#")+'" target="_blank" rel="noopener">'+
          (u?'<img src="'+u+'" alt="" loading="lazy">':'<div class="gal"><div class="hint" style="padding:30px">önizleme yok</div></div>')+
          '<div class="cap">'+(x.kuyu?esc(x.kuyu)+' · ':'')+trd(x.tarih)+'</div></a>'; }).join("");
    });
  });
});
})();
</script>
</body>
</html>
