<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collarlog · İşveren Paneli</title>

<link rel="apple-touch-icon" href="logo/png/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16212A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================
   İŞVEREN PANELİ (93. dosya · 60. adım)
   İşveren masaüstünden bakıyor (S8): telefon için ayrıca
   tasarlanmadı, yalnız bozulmuyor.
   İşveren kullanıcısında yan menü yok — tek sayfası var.
   Şirket kullanıcısı (önizleme) yan menüyü görmeye devam ediyor.
   ============================================================ */
.isveren-modu .sp-shell{grid-template-columns:1fr}
.isveren-modu .sp-side{display:none}

.ip-proje{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.ip-proje h2{font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1.05;margin:0}
.ip-proje .alt{color:var(--ink-2);font-size:13px;margin-top:3px}
.ip-proje .sec{margin-inline-start:auto;min-width:220px}
.ip-proje .etk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.canli{color:var(--good);font-weight:500}
.canli::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-inline-end:6px;vertical-align:1px}

.ip-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ip-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:7px 14px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}
.ip-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--dolu-yazi)}

/* Genel durum: iki rakam + kapalı başlık listesi */
.ozet-tek{display:flex;gap:34px;flex-wrap:wrap;margin-bottom:20px}
.ozet-tek > div{display:grid;gap:2px}
.ozet-tek .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ozet-tek .v{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.ozet-tek .v small{font-size:15px;color:var(--ink-2);margin-inline-start:3px}
.liste{display:grid;gap:8px;max-width:1040px}
.grup{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:14px 0 2px}
.grup:first-child{margin-top:0}
.ips{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ips.on{border-color:var(--accent);box-shadow:var(--shadow)}
.ips-bas{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--ink);padding:15px 18px;text-align:start;font:inherit;cursor:pointer}
.ips-bas:hover{background:var(--line-soft)}
.ips-bas .harf{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;color:#E8731A;width:14px}
.ips-bas .ips-ad{font-weight:600;font-size:15px;flex:1;min-width:0}
.ips-bas .ips-ok{font-size:20px;line-height:1;color:var(--ink-3);width:20px;text-align:center}
.ips.on .ips-ok{color:var(--accent)}
.ips-ic{padding:14px 18px 18px;border-top:1px solid var(--line-soft)}
.ic-bas{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.buyuk{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;line-height:1.05}
.buyuk small{font-size:16px;color:var(--ink-2);margin-inline-start:4px}
.acik{color:var(--ink-2);font-size:13px;max-width:64ch;margin-top:3px}
.secim{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap}
.secim button{border:1px solid var(--line);background:none;color:var(--ink-2);padding:5px 10px;border-radius:7px;font:inherit;font-size:12.5px;cursor:pointer}
.secim button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lejant{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.lejant i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.alt-rakam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.alt-rakam div{font-size:12px;color:var(--ink-2)}
.alt-rakam b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:20px;color:var(--ink)}
.ip-not{font-size:12px;color:var(--ink-3);margin-top:10px}

/* çizimler */
.cz{width:100%;height:auto;display:block}
.cz text{font-family:"IBM Plex Sans",sans-serif;font-size:14px;fill:var(--ink-3)}
.cz .izgara{stroke:var(--line-soft);stroke-width:1}
.cz .eksen{stroke:var(--line);stroke-width:1}
.cz .cb{fill:var(--accent);opacity:.82}
.cz .cb.acik-renk{opacity:.28}
.cz .cb.kirmizi{fill:var(--bad);opacity:.9}
.cz .ort{stroke:#E8731A;stroke-width:2;stroke-dasharray:6 4;fill:none}
.cz .plan{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.cz .egri{stroke:var(--accent);stroke-width:2.5;fill:none}
.cz .alan{fill:var(--accent);opacity:.12}
.cz .cb:hover{opacity:1}
.cz-ipucu{min-height:20px;font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* duruş */
.durus-sat{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.durus-sat .iz{height:10px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.durus-sat .iz i{display:block;height:100%}
.olay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;padding:8px 0;border-top:1px solid var(--line-soft)}
.olay .t{color:var(--ink-3);font-size:12px;white-space:nowrap}
.dp{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dp.ariza{background:var(--bad-soft);color:var(--bad)}
.dp.bekleme{background:var(--warn-soft);color:var(--warn)}
.dp.tasima,.dp.bakim{background:var(--line-soft);color:var(--ink-2)}
.dp.ilerleme_yok{background:var(--accent-soft);color:var(--accent-ink)}

@media (max-width:760px){
  .ip-proje .sec{margin-inline-start:0;width:100%}
  .alt-rakam{grid-template-columns:repeat(2,minmax(0,1fr))}
  .durus-sat{grid-template-columns:90px minmax(0,1fr) 56px}
}

/* ---------- Kuyular sekmesi (2. paket) ---------- */
.ky-duzen{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr);gap:14px;align-items:start}
.ky-liste table td{padding:9px 8px;vertical-align:middle;white-space:normal}
.ky-liste table th{white-space:normal;padding:8px}
/* Liste kendi içinde kayar; ayrıntı yerinde kalır */
.ky-liste .scroll{max-height:72vh;overflow:auto}
.ky-liste thead th{position:sticky;top:0;background:var(--card);z-index:1}
.ky-detay{position:sticky;top:12px}
.ky-bilgi b small{font-size:13px;color:var(--ink-2);margin-inline-start:3px;font-family:"IBM Plex Sans",sans-serif;font-weight:500}
.ky-uyari{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px;margin-top:8px}
.ky-liste tr.tik{cursor:pointer}
.ky-liste tr.tik:hover td{background:var(--line-soft)}
.ky-liste tr.sec td{background:var(--accent-soft)}
.ky-kucuk{font-size:11.5px;color:var(--ink-3)}
.ky-bar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:4px;min-width:70px}
.ky-bar i{display:block;height:100%;background:var(--accent)}
.ky-bar i.tam{background:var(--good)}
.ky-tahmin{color:#E8731A;font-weight:600;white-space:nowrap}
.ky-pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ky-pill.drilling{background:var(--accent-soft);color:var(--accent-ink)}
.ky-pill.completed{background:var(--good-soft);color:var(--good)}
.ky-pill.planned{background:var(--line-soft);color:var(--ink-2)}
.ky-detay h3{font-family:"Barlow Condensed",sans-serif;font-size:24px;margin:0}
.ky-tahmin-kutu{border:1px solid #E8731A;border-radius:11px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:12px}
.ky-tahmin-kutu .etk{width:100%;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ky-tahmin-kutu b{font-family:"Barlow Condensed",sans-serif;font-size:30px;color:#E8731A}
.ky-tahmin-kutu span{color:var(--ink-2);font-size:13px}
.ky-bos{color:var(--ink-3);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:12px}
.ky-bilgi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.ky-bilgi span{display:block;font-size:12px;color:var(--ink-3)}
.ky-bilgi b{font-family:"Barlow Condensed",sans-serif;font-size:19px}
.ky-alt{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.ky-etk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:16px 0 6px}
.cz .tahminc{stroke:#E8731A;stroke-width:2;stroke-dasharray:6 4;fill:none}
.cz .nokta{fill:#E8731A}

/* ---------- PDF rapor ---------- */
.rp-ayar .row{align-items:flex-end}
.rp-donem{display:flex;gap:4px;flex-wrap:wrap}
.rp-donem button{border:1px solid var(--line);background:none;color:var(--ink-2);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.rp-donem button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.rapor{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:26px 30px;max-width:900px}
.rapor .rp-antet{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
.rapor .rp-antet img{height:34px;width:auto;max-width:140px;object-fit:contain}
.rapor .rp-antet h2{font-family:"Barlow Condensed",sans-serif;font-size:23px;margin:0}
.rapor .rp-antet .sg{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--ink-3)}
.rapor h4{font-family:"Barlow Condensed",sans-serif;font-size:16px;letter-spacing:.03em;margin:18px 0 6px;color:var(--accent-ink)}
.rp-k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rp-k4 div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rp-k4 span{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.rp-k4 b{font-family:"Barlow Condensed",sans-serif;font-size:21px}
.rapor table{font-size:12.5px}
.rp-ayak{margin-top:16px;padding-top:6px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px}
@media print{
  .rapor{border:0;padding:0;max-width:none}
  .rp-k4,.rapor .cz,.rapor table{break-inside:avoid}
  .rapor h4{break-after:avoid}
  .ip-proje,#msg{display:none!important}
  .rapor-sekmesi .antet{display:none!important}
  .rp-k4{grid-template-columns:repeat(4,minmax(0,1fr))!important}
}
@media (max-width:900px){
  .ky-duzen{grid-template-columns:minmax(0,1fr)}
  .ky-bilgi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ky-alt{grid-template-columns:minmax(0,1fr)}
  .rp-k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media print{ .ip-tabs,.no-print{display:none!important} }
</style>
</head>
<body>

<div id="sp-icerik">

  <div id="scr-main">
    <div class="antet" id="antet"></div>

    <div class="ip-proje">
      <div>
        <div class="etk" data-t="proje">Proje</div>
        <h2 id="p-ad">—</h2>
        <div class="alt" id="p-alt"></div>
      </div>
      <div class="field sec no-print"><label for="f-proj" data-t="sahaProje">Saha / proje</label><select id="f-proj"></select></div>
    </div>
    <div id="msg"></div>

    <nav class="ip-tabs" id="tabs">
      <button type="button" data-s="genel" class="on" data-t="tGenel">Genel durum</button>
      <button type="button" data-s="kuyu" data-t="tKuyu">Kuyular</button>
      <button type="button" data-s="gun" data-t="tGun">Günlük rapor</button>
      <button type="button" data-s="rapor" data-t="tRapor">PDF rapor</button>
    </nav>

    <!-- GENEL DURUM -->
    <section data-p="genel">
      <div class="ozet-tek" id="ozet"></div>
      <div class="liste" id="liste"></div>
      <div class="ip-not" id="genel-not"></div>
    </section>

    <!-- KUYULAR -->
    <section data-p="kuyu" hidden>
      <div class="ky-duzen">
        <div class="card ky-liste">
          <h3 data-t="tKuyu">Kuyular</h3>
          <div class="note" data-t="kuyuSec">Kuyuya tıklayın, ayrıntısı sağda açılır.</div>
          <div class="scroll"><table id="ky-tablo"></table></div>
        </div>
        <div class="card ky-detay" id="ky-detay"></div>
      </div>
    </section>

    <!-- GÜNLÜK -->
    <section data-p="gun" hidden>
      <div class="card no-print">
        <div class="row">
          <div class="field"><label for="g-date" data-t="tarih">Tarih</label><input id="g-date" type="date"></div>
          <button class="btn" id="btn-gun" type="button" data-t="getir">Getir</button>
          <button class="btn ghost" id="btn-gun-dun" type="button" data-t="oncekiGun">Önceki gün</button>
          <button class="btn ghost" id="btn-gun-yaz" type="button" data-t="yazdir">Yazdır / PDF</button>
        </div>
      </div>
      <div id="gun-out"></div>
    </section>

    <!-- PDF RAPOR -->
    <section data-p="rapor" hidden>
      <div class="card no-print rp-ayar">
        <div class="row">
          <div class="field"><label data-t="donem">Dönem</label>
            <div class="rp-donem" id="rp-donem">
              <button type="button" data-d="gun" data-t="dGun">Günlük</button>
              <button type="button" data-d="hafta" class="on" data-t="dHafta">Haftalık</button>
              <button type="button" data-d="ay" data-t="dAy">Aylık</button>
              <button type="button" data-d="aralik" data-t="dAralik">Tarih aralığı</button>
            </div></div>
          <div class="field" id="rp-tek"><label for="rp-gun" data-t="rpGun">Gün</label><input id="rp-gun" type="date"></div>
          <div class="field" id="rp-bas-k" hidden><label for="rp-bas" data-t="bas">Başlangıç</label><input id="rp-bas" type="date"></div>
          <div class="field" id="rp-bit-k" hidden><label for="rp-bit" data-t="bit">Bitiş</label><input id="rp-bit" type="date"></div>
          <button class="btn" id="btn-rp" type="button" data-t="hazirla">Raporu hazırla</button>
          <button class="btn ghost" id="btn-rp-pdf" type="button" data-t="pdfKaydet">PDF olarak kaydet</button>
          <button class="btn ghost" id="btn-rp-csv" type="button" data-t="excel">Excel (CSV)</button>
        </div>
        <div class="note" id="rp-donem-yazi"></div>
      </div>
      <div id="rapor-out"></div>
    </section>
  </div>
</div>

function gzAdim(mx){
  var ham=mx/5, us=Math.pow(10, Math.floor(Math.log10(ham||1))), n=ham/us;
  return (n<=1?1:n<=2?2:n<=5?5:10)*us;
}
/* d: [{e:etiket, v:değer, cls:"", ipucu:""}], ort: kesikli çizgi */
function cubukSvg(d, ort, ops){
  ops=ops||{}; var W=1000, H=ops.h||300, SL=60, SR=12, ST=12, SB=30;
  var mx=Math.max.apply(null, d.map(function(x){return Number(x.v)||0;}).concat([Number(ort)||0, 1]));
  var adim=gzAdim(mx); mx=Math.ceil(mx/adim)*adim;
  var y=function(v){ return ST+(H-ST-SB)*(1-v/mx); };
  var bw=(W-SL-SR)/Math.max(d.length,1), s='<svg class="cz" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var k=0;k<=mx+1e-9;k+=adim){
    s+='<line class="izgara" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(k)+'" y2="'+y(k)+'"/>'+
       '<text x="'+(SL-8)+'" y="'+(y(k)+4)+'" text-anchor="end">'+tl(k,0)+'</text>';
  }
  var her=Math.max(1, Math.ceil(d.length/(ops.etiket||14)));
  d.forEach(function(x,i){
    var v=Number(x.v)||0, h=Math.max((H-ST-SB)*v/mx, ops.enaz||0), xx=SL+i*bw+bw*0.14;
    s+='<rect class="cb '+(x.cls||"")+'" data-i="'+i+'" x="'+xx+'" y="'+(H-SB-h)+'" width="'+(bw*0.72)+'" height="'+h+'" rx="2">'+
       '<title>'+esc(x.ipucu||(x.e+": "+tl(v,1)+" m"))+'</title></rect>';
    if(i%her===0) s+='<text x="'+(SL+i*bw+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(x.e)+'</text>';
  });
  if(ort!=null && isFinite(ort)) s+='<line class="ort" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(ort)+'" y2="'+y(ort)+'"/>';
  return s+'</svg>';
}

function icA(){

/* D — toplam: birikimli metre eğrisi + plan */
function egriSvg(gn, plan, ops){
  ops=ops||{};
  var W=1000, H=ops.h||300, SL=66, SR=14, ST=12, SB=30, son=Number(gn[gn.length-1].birikimli)||0;
  var mx=Math.max(son, plan||0, 1), adim=gzAdim(mx); mx=Math.ceil(mx/adim)*adim;
  var x=function(i){ return SL+(W-SL-SR)*(gn.length>1?i/(gn.length-1):0); };
  var y=function(v){ return ST+(H-ST-SB)*(1-v/mx); };
  var s='<svg class="cz" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var k=0;k<=mx+1e-9;k+=adim) s+='<line class="izgara" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(k)+'" y2="'+y(k)+'"/><text x="'+(SL-8)+'" y="'+(y(k)+4)+'" text-anchor="end">'+tl(k,0)+'</text>';
  var nok=gn.map(function(g,i){ return x(i).toFixed(1)+","+y(Number(g.birikimli)).toFixed(1); });
  s+='<path class="alan" d="M'+x(0)+','+y(0)+' L'+nok.join(" L")+' L'+x(gn.length-1)+','+y(0)+' Z"/>';
  s+='<path class="egri" d="M'+nok.join(" L")+'"/>';
  if(plan) s+='<line class="plan" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(plan)+'" y2="'+y(plan)+'"/>';
  var her=Math.max(1,Math.ceil(gn.length/10));
  gn.forEach(function(g,i){ if(i%her===0) s+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+kisa(g.tarih)+'</text>'; });
  return s+'</svg>';
}
function icD(){
  var dd=GENEL.d||{}, gn=dd.gunler||[], el=$("#ic");
  var h='<div class="ic-bas"><div><div class="buyuk num">'+tl(dd.gunluk,1)+'<small>'+t("mGun")+'</small></div>'+
    '<div class="acik">'+t("dAcik")+'</div></div></div>';
  if(!gn.length){ el.innerHTML=h+'<div class="hint">'+t("vardiyaYok")+'</div>'; return; }
  var plan=Number(dd.plan)||0, son=Number(gn[gn.length-1].birikimli)||0;
  h+='<div>'+egriSvg(gn, plan)+'</div>'+lejant([[RENK.ac,t("birikimli")]].concat(plan?[[RENK.plan,t("plan")+" ("+tl(plan,0)+" m)"]]:[]))+
    altRakam([[t("toplam"), tl(dd.toplam,0)+" m"],[t("gunlukOrt"), tl(dd.gunluk,1)],[t("mVardiya"), tl(dd.vardiya_ort,1)],
      plan?[t("plana"), "%"+tl(son/plan*100,0)]:[t("gun"), String(dd.gun)]]);
  el.innerHTML=h;
}

/* Duruş ve arıza — son 30 gün */
function durusBarlar(tr){
  var mx=Math.max.apply(null, tr.map(function(x){return Number(x.saat)||0;}).concat([1]));
  var renk={ariza:"var(--bad)", bekleme:"var(--warn)", tasima:"var(--ink-3)", bakim:"var(--accent-2)"};
  return tr.map(function(x){ return '<div class="durus-sat"><span>'+(S("DTUR")[x.tur]||x.tur)+'</span><div class="iz"><i style="width:'+
      (Number(x.saat)/mx*100)+'%;background:'+(renk[x.tur]||"var(--ink-3)")+'"></i></div><span class="num" style="text-align:end">'+tl(x.saat,1)+' '+t("sa")+'</span></div>'; }).join("");
}
function durusOlaylari(l){
  return (l||[]).map(function(o){
    var ac=durusAciklama(o.kalemler);
    return '<div class="olay"><span class="t num">'+trd(o.tarih)+' · '+(S("VARD")[o.vardiya]||"")+'</span><span>'+
      (o.kalemler||[]).map(durusRozet).join(" ")+' '+esc(o.makine)+(ac?' — '+esc(ac):'')+'</span></div>'; }).join("");
}
function icDurus(){
  var u=GENEL.durus||{}, tr=u.turler||[], el=$("#ic");
  var h='<div class="acik" style="margin:0 0 10px">'+trd(u.bas)+' – '+trd(u.bit)+' · '+t("kayipSaat")+'</div>';
  if(!tr.length && !u.ilerleme_yok){ el.innerHTML=h+'<div class="hint">'+t("durusYok")+'</div>'; return; }
  h+=durusBarlar(tr);
  if(u.ilerleme_yok) h+='<div class="hint" style="margin-top:6px">'+t("ilerlemeYokV")+': '+u.ilerleme_yok+'</div>';
  if((u.son||[]).length) h+='<div class="grup" style="margin-top:16px">'+t("sonKayit")+'</div>'+durusOlaylari(u.son);
  el.innerHTML=h;
}

/* ============================================================
   KUYULAR (2. paket)
   ============================================================ */
function kuyular(){
  var pj=$("#f-proj").value; if(!pj) return;
  $("#ky-tablo").innerHTML='<tbody><tr><td class="hint">'+t("yukleniyor")+'</td></tr></tbody>';
  sb.rpc("employer_kuyular", {p_project:pj}).then(function(r){
    if(r.error){ $("#ky-tablo").innerHTML='<tbody><tr><td><div class="msg err">'+esc(r.error.message)+'</div></td></tr></tbody>'; return; }
    KUYULAR=r.data; kuyuListe();
  });
}
function bitisHucre(k){
  if(k.durum==="completed") return trd(k.bitis);
  if(k.tahmin) return '<span class="ky-tahmin">~ '+trd(k.tahmin)+'</span>';
  if(k.eksik_vardiya) return '<span class="ky-kucuk">'+t(k.eksik_vardiya===1?"vSonra1":"vSonra",{n:k.eksik_vardiya})+'</span>';
  if(k.tahmin_yok==="plan") return '<span class="ky-kucuk">'+t("planYok")+'</span>';
  return '—';
}
function kuyuListe(){
  var L=(KUYULAR||{}).kuyular||[];
  if(!L.length){ $("#ky-tablo").innerHTML='<tbody><tr><td class="hint">'+t("kuyuYok")+'</td></tr></tbody>'; $("#ky-detay").innerHTML=""; return; }
  if(!KSEC || !L.some(function(k){return k.id===KSEC;})) KSEC=L[0].id;
  $("#ky-tablo").innerHTML='<thead><tr><th>'+t("kuyu")+'</th><th style="text-align:end">'+t("delPlan")+'</th><th>'+t("durum")+'</th><th style="text-align:end">'+t("bitisTahmin")+'</th></tr></thead><tbody>'+
    L.map(function(k){
      var y=k.planlanan?Math.min(100, k.derinlik/k.planlanan*100):(k.durum==="completed"?100:0);
      return '<tr class="tik'+(k.id===KSEC?' sec':'')+'" data-k="'+k.id+'"><td><b>'+esc(k.kod)+'</b><div class="ky-kucuk">'+esc(k.makine||"—")+'</div></td>'+
        '<td class="num" style="text-align:end">'+tl(k.derinlik,0)+' <span class="ky-kucuk">/ '+(k.planlanan?tl(k.planlanan,0):'—')+'</span>'+
        '<div class="ky-bar"><i class="'+(k.durum==="completed"?'tam':'')+'" style="width:'+y+'%"></i></div></td>'+
        '<td><span class="ky-pill '+esc(k.durum)+'">'+(S("KDURUM")[k.durum]||k.durum)+'</span></td>'+
        '<td class="num" style="text-align:end">'+bitisHucre(k)+'</td></tr>'; }).join("")+'</tbody>';
  $$("#ky-tablo tr.tik").forEach(function(tr){ tr.onclick=function(){
    KSEC=tr.dataset.k; $$("#ky-tablo tr.tik").forEach(function(x){ x.classList.toggle("sec", x===tr); }); kuyuDetay(); }; });
  kuyuDetay();

function kuyuDetay(){
  var el=$("#ky-detay");
  el.innerHTML='<div class="hint">'+t("yukleniyor")+'</div>';
  var istenen=KSEC;
  sb.rpc("employer_kuyu", {p_well:KSEC}).then(function(r){
    if(istenen!==KSEC) return;
    if(r.error){ el.innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>'; return; }
    kuyuCiz(r.data);
  });
}
function bugunTarih(){ return (KUYULAR&&KUYULAR.bugun)||(GENEL&&GENEL.bugun)||iso(new Date()); }
function bostaGun(k){ return k.son_vardiya ? Math.round((new Date(bugunTarih())-new Date(k.son_vardiya))/864e5) : 0; }
function kuyuCiz(D){
  var k=D.kuyu||{}, el=$("#ky-detay"), h='';
  h+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 id="ky-ad">'+esc(k.kod)+(k.makine?' · '+esc(k.makine):'')+'</h3>'+
     '<span class="ky-pill '+esc(k.durum)+'">'+(S("KDURUM")[k.durum]||k.durum)+'</span></div>';
  if(k.durum==="drilling"){
    if(k.tahmin) h+='<div class="ky-tahmin-kutu" id="ky-tahmin"><span class="etk">'+t("tahminiBitis")+'</span><b class="num">'+trd(k.tahmin)+'</b>'+
        '<span>'+t("tahminAcik",{h:tl(k.hiz*k.gunluk_vardiya,1), g:k.kalan_gun})+'</span></div>'+
        (bostaGun(k)>2?'<div class="ky-uyari" id="ky-bosta">'+t("bosta",{t:trd(k.son_vardiya), g:bostaGun(k)})+'</div>':'');
    else h+='<div class="ky-bos" id="ky-tahmin-yok">'+(k.tahmin_yok==="vardiya"
        ? t("tYokVardiya",{v:k.vardiya, n:k.eksik_vardiya, gn:Math.ceil(10/(k.gunluk_vardiya||2))})
        : k.tahmin_yok==="plan" ? t("tYokPlan") : t("tYokMetre"))+'</div>';
  }
  if(!Number(k.derinlik) && !k.vardiya){ el.innerHTML=h+'<div class="ky-bos">'+t("baslamadi")+'</div>'; return; }
  var b=[[t("planlanan"), k.planlanan?tl(k.planlanan,0)+" m":"—"],[t("delinen"), tl(k.derinlik,0)+" m"],
         [t("ortHiz"), k.hiz!=null?tl(k.hiz,1)+"<small>"+t("mVardiya")+"</small>":"—"],[t("baslama"), trd(k.baslama)]];
  if(k.durum==="completed"){
    var gs=(k.bitis&&k.baslama)?Math.round((new Date(k.bitis)-new Date(k.baslama))/864e5)+1:null;
    b.push([t("bitis"), trd(k.bitis)]); b.push([t("sure"), gs!=null?gs+" "+t("gunK"):"—"]);
  } else b.push([t("kalan"), k.kalan!=null?tl(k.kalan,0)+" m":"—"]);
  h+='<div class="ky-bilgi num">'+b.map(function(x){ return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'; }).join("")+'</div>';
  /* derinlik ilerlemesi */
  var seri=D.seri||[];
  if(seri.length){
    h+='<div class="ky-etk">'+t("ilerlemeGraf")+'</div><div id="ky-graf">'+derinlikSvg(seri, k)+'</div>'+
      lejant([[RENK.ac,t("delinen")]].concat(k.tahmin?[[RENK.ort,t("tahmin")+" ("+t("ortHiz").toLowerCase()+")"]]:[]).concat(k.planlanan?[[RENK.plan,t("planlanan")+" "+tl(k.planlanan,0)+" m"]]:[]));
  }
  /* kesit + ölçümler */
  h+='<div class="ky-alt"><div><div class="ky-etk" style="margin-top:0">'+t("kesit")+'</div>'+kesitSvg(D)+'</div>'+
     '<div><div class="ky-etk" style="margin-top:0">'+t("olcumler")+'</div>'+olcumTablo(D.olcumler||[])+'</div></div>';
  el.innerHTML=h;
}
/* Derinlik ekseni aşağı doğru: kuyu derinleştikçe çizgi iner */
function derinlikSvg(seri, k){
  var W=1000, H=260, SL=66, SR=14, ST=12, SB=30;
  var bas=seri[0].tarih, son=k.tahmin||seri[seri.length-1].tarih;
  var gunSay=Math.max(1, Math.round((new Date(son)-new Date(bas))/864e5));
  var mx=Math.max(Number(k.planlanan)||0, Number(k.derinlik)||0, Number(seri[seri.length-1].derinlik)||0, 1);
  var adim=gzAdim(mx); mx=Math.ceil(mx/adim)*adim;
  var x=function(tar){ return SL+(W-SL-SR)*Math.round((new Date(tar)-new Date(bas))/864e5)/gunSay; };
  var y=function(v){ return ST+(H-ST-SB)*(v/mx); };
  var s='<svg class="cz" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var m=0;m<=mx+1e-9;m+=adim) s+='<line class="izgara" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(m)+'" y2="'+y(m)+'"/><text x="'+(SL-8)+'" y="'+(y(m)+4)+'" text-anchor="end">'+tl(m,0)+'</text>';
  if(k.planlanan) s+='<line class="plan" x1="'+SL+'" x2="'+(W-SR)+'" y1="'+y(k.planlanan)+'" y2="'+y(k.planlanan)+'"/>';
  s+='<path class="egri" d="M'+seri.map(function(p){ return x(p.tarih).toFixed(1)+","+y(Number(p.derinlik)).toFixed(1); }).join(" L")+'"/>';
  if(k.tahmin){
    /* Tahmin BUGÜNDEN başlar. Kuyu bir süre boşta kaldıysa son
       vardiyadan bugüne düz, gri kesikli çizgi: o aralıkta delgi yok. */
    var sonN=seri[seri.length-1], bug=bugunTarih(); if(bug<sonN.tarih) bug=sonN.tarih;
    if(bug>sonN.tarih) s+='<path class="plan" d="M'+x(sonN.tarih)+','+y(Number(k.derinlik))+' L'+x(bug)+','+y(Number(k.derinlik))+'"/>';
    s+='<path class="tahminc" d="M'+x(bug)+','+y(Number(k.derinlik))+' L'+x(k.tahmin)+','+y(Number(k.planlanan))+'"/>'+
       '<circle class="nokta" cx="'+x(k.tahmin)+'" cy="'+y(Number(k.planlanan))+'" r="6"/>';
  }
  var her=Math.max(1, Math.ceil(gunSay/9));
  for(var i=0;i<=gunSay;i+=her){ var tar=gunEkle(bas,i); s+='<text x="'+x(tar)+'" y="'+(H-10)+'" text-anchor="middle">'+kisa(tar)+'</text>'; }
  return s+'</svg>';
}
function kesitSvg(D){
  var k=D.kuyu||{}, c=D.caplar||[];
  var plan=Math.max(Number(k.planlanan)||0, Number(k.derinlik)||0, 1);
  var H=360, UST=24, ALT=14, X=100, olcek=(H-UST-ALT)/plan, y=function(m){ return UST+m*olcek; };
  var gen={PQ:46, HQ:36, NQ:26, PW:52}, renk={PQ:"var(--pq)", HQ:"var(--hq)", NQ:"var(--nq)", PW:"var(--pw)"};
  var adim=gzAdim(plan);
  var s='<svg class="cz" viewBox="0 0 200 '+H+'" style="max-width:220px" role="img">';
  s+='<rect x="45" y="'+UST+'" width="110" height="'+(H-UST-ALT)+'" fill="var(--kaya-2)" opacity=".35" rx="3"/>';
  for(var m=0;m<=plan+1e-9;m+=adim) s+='<line x1="38" x2="45" y1="'+y(m)+'" y2="'+y(m)+'" stroke="var(--ink-3)"/><text x="34" y="'+(y(m)+4)+'" text-anchor="end" style="font-size:11px">'+tl(m,0)+'</text>';
  c.forEach(function(p){
    var w=gen[p.cap]||30, b=Number(p.bas)||0, e=Number(p.son)||0; if(e<=b) return;
    s+='<rect x="'+(X-w/2)+'" y="'+y(b)+'" width="'+w+'" height="'+(y(e)-y(b))+'" fill="'+(renk[p.cap]||"var(--accent)")+'"/>'+
       '<text x="'+(X+w/2+5)+'" y="'+(y((b+e)/2)+4)+'" style="font-size:11px;font-weight:600;fill:var(--ink)">'+esc(p.cap)+'</text>';
  });
  s+='<line x1="70" x2="130" y1="'+y(Number(k.derinlik)||0)+'" y2="'+y(Number(k.derinlik)||0)+'" stroke="#E8731A" stroke-width="2.5"/>'+
     '<text x="158" y="'+(y(Number(k.derinlik)||0)+4)+'" style="font-size:11px;font-weight:700;fill:#E8731A">'+tl(k.derinlik,0)+' m</text>';
  s+='<text x="100" y="14" text-anchor="middle" style="font-size:11px">'+t("zemin")+' 0 m</text>';
  return s+'</svg>';
}
function olcumTablo(L){
  if(!L.length) return '<div class="hint">'+t("olcumYok")+'</div>';
  return '<div class="scroll"><table><thead><tr><th style="text-align:end">'+t("derinlik")+'</th><th style="text-align:end">'+t("azimut")+'</th><th style="text-align:end">'+t("egim")+'</th><th>'+t("tarih")+'</th></tr></thead><tbody>'+
    L.map(function(o){ return '<tr><td class="num" style="text-align:end">'+(o.derinlik!=null?tl(o.derinlik,1)+' m':'—')+'</td><td class="num" style="text-align:end">'+(o.azimut!=null?tl(o.azimut,1)+'°':'—')+
      '</td><td class="num" style="text-align:end">'+(o.egim!=null?tl(o.egim,1)+'°':'—')+'</td><td class="hint">'+trd(o.tarih)+'</td></tr>'; }).join("")+'</tbody></table></div>';
}

/* ============================================================
   GÜNLÜK — mazot (S2), sondör ve ekip (S4) yok; duruş var (S3)
   ============================================================ */
function tbl(cols, rows, empty, foot){
  if(!rows || !rows.length) return '<div class="hint">'+empty+'</div>';
  return '<div class="scroll"><table><thead><tr>'+cols.map(function(c){ return '<th>'+c[0]+'</th>'; }).join("")+
    '</tr></thead><tbody>'+rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+c[1](r)+'</td>'; }).join("")+'</tr>'; }).join("")+
    '</tbody>'+(foot?'<tfoot><tr>'+foot+'</tr></tfoot>':'')+'</table></div>';
}
function tiles(list){
  return '<div class="tiles">'+list.map(function(x){
    return '<div class="tile"><div class="k">'+x[0]+'</div><div class="v num">'+x[1]+
      '</div><div class="hint">'+(x[2]||"")+'</div></div>'; }).join("")+'</div>';
}
function gun(){
  var pj=$("#f-proj").value; if(!pj) return;
  $("#gun-out").innerHTML='<div class="card"><div class="hint">'+t("yukleniyor")+'</div></div>';
  sb.rpc("employer_daily", {p_project:pj, p_date:$("#g-date").value}).then(function(r){
    if(r.error){ $("#gun-out").innerHTML='<div class="card"><div class="msg err">'+esc(r.error.message)+'</div></div>'; return; }
    var d=r.data, v=d.vardiyalar||[];
    var h='<div class="card"><h3>'+esc(d.proje||"")+' · '+trd(d.tarih)+'</h3>'+
      '<div class="note">'+t("gunNot")+'</div>'+
      tiles([[t("gunMetraj"), tl(d.toplam_metraj)+' <small>m</small>'],
             [t("vardiyaS"), String(v.length)],
             [t("durusluVardiya"), String(v.filter(function(s){ return (s.durus||[]).length; }).length)]])+'</div>';
    if(!v.length){ h+='<div class="card"><div class="hint">'+t("kayitYok")+'</div></div>'; }
    v.forEach(function(s){
      var du=s.durus||[];
      h+='<div class="card" data-vardiya><div class="vard"><h4>'+(S("VARD")[s.vardiya]||s.vardiya)+' '+t("vardiyasi")+' — '+
        esc(s.kuyu)+' · '+esc(s.makine)+(s.form_no?' <span class="hint">'+t("form")+' '+esc(s.form_no)+'</span>':'')+'</h4>'+
        '<div class="hint">'+t("kuyuDerinligi")+' '+tl(s.kuyu_derinlik)+' m · '+(S("KDURUM")[s.kuyu_durum]||s.kuyu_durum)+
        (s.motor_bas?' · '+t("motor")+' '+String(s.motor_bas).slice(0,5)+'–'+String(s.motor_bit||"").slice(0,5):'')+
        ' · '+t("vardiyaMetraji")+' <b>'+tl(s.metraj)+' m</b>'+(s.olcum?' · '+s.olcum+' '+t("olcum"):'')+'</div>'+
        (du.length?'<div style="margin-top:6px">'+du.map(durusRozet).join(" ")+
          ' <span class="hint">'+esc(durusAciklama(du))+'</span></div>':'')+
        '</div>'+
        tbl([[t("sira"),function(x){return x.sira;}],
             [t("cap"),function(x){return esc(x.cap);}],
             [t("basM"),function(x){return '<span class="num">'+tl(x.baslangic)+'</span>';}],
             [t("bitM"),function(x){return '<span class="num">'+tl(x.bitis)+'</span>';}],
             [t("metre"),function(x){return '<span class="num"><b>'+tl(x.metre)+'</b></span>';}]],
            s.manevralar, t("manevraYok")) +
        (s["not"]?'<div class="hint" style="margin-top:8px">'+t("not")+': '+esc(s["not"])+'</div>':'')+
        (s.bitis?'<div class="msg warn" style="margin-top:8px">'+(s.bitis==="kuyu_iptali"?t("kuyuIptal"):t("kuyuTamam"))+'</div>':'')+
        '</div>';
    });
    $("#gun-out").innerHTML=h;
  });
}
$("#btn-gun").addEventListener("click", gun);
$("#g-date").addEventListener("change", gun);
$("#btn-gun-dun").addEventListener("click", function(){
  $("#g-date").value=gunEkle($("#g-date").value||iso(new Date()), -1); gun();
});
$("#btn-gun-yaz").addEventListener("click", function(){ window.print(); });

/* ============================================================
   PDF RAPOR — günlük / haftalık (Pzt–Paz) / aylık / tarih aralığı.
   PDF tarayıcının "PDF olarak kaydet"i ile çıkar.
   ============================================================ */
var RDON="hafta";
function donemAraligi(){
  var g=$("#rp-gun").value||iso(new Date());
  if(RDON==="gun") return [g,g];
  if(RDON==="hafta"){ var d=new Date(g+"T00:00:00"), f=(d.getDay()+6)%7; var b=gunEkle(g,-f); return [b, gunEkle(b,6)]; }
  if(RDON==="ay"){ var a=g.slice(0,8)+"01", s=new Date(+g.slice(0,4), +g.slice(5,7), 0); return [a, iso(s)]; }
  return [$("#rp-bas").value, $("#rp-bit").value];
}
function rpDonemYaz(){
  var a=donemAraligi(); $("#rp-donem-yazi").textContent=t("rpDonem",{a:trd(a[0]), b:trd(a[1])})+" · "+t("rpPdfNot");
}
$$("#rp-donem button").forEach(function(b){ b.addEventListener("click", function(){
  RDON=b.dataset.d; $$("#rp-donem button").forEach(function(x){ x.classList.toggle("on", x===b); });
  var ar=(RDON==="aralik"); $("#rp-tek").hidden=ar; $("#rp-bas-k").hidden=!ar; $("#rp-bit-k").hidden=!ar;
  $("#rp-tek label").textContent=t(RDON==="ay"?"dAy":RDON==="hafta"?"dHafta":"rpGun");
  rpDonemYaz();
}); });
["#rp-gun","#rp-bas","#rp-bit"].forEach(function(s){ $(s).addEventListener("change", rpDonemYaz); });

function rapor(sonra){
  var pj=$("#f-proj").value; if(!pj) return;
  var a=donemAraligi(); if(!a[0]||!a[1]||a[0]>a[1]) return;
  $("#rapor-out").innerHTML='<div class="hint">'+t("yukleniyor")+'</div>';
  var istek=[sb.rpc("employer_report", {p_project:pj, p_from:a[0], p_to:a[1]}),
             sb.rpc("employer_durus_donem", {p_project:pj, p_from:a[0], p_to:a[1]}),
             sb.rpc("employer_kuyular", {p_project:pj, p_gun:a[1]}),
             GENEL ? Promise.resolve({data:GENEL}) : sb.rpc("employer_genel", {p_project:pj})];
  Promise.all(istek).then(function(c){
    var hata=c.filter(function(x){ return x.error; })[0];
    if(hata){ $("#rapor-out").innerHTML='<div class="msg err">'+esc(hata.error.message)+'</div>'; return; }
    DONEM=c[0].data; if(!GENEL) GENEL=c[3].data;
    raporCiz(a, c[0].data, c[1].data, c[2].data, GENEL);
    if(sonra) sonra();
  });
}
function raporCiz(a, R, U, K, G){
  var tt=R.toplam||{}, p=R.proje||{};
  var vo=Number(tt.uretken)?Number(tt.metraj)/Number(tt.uretken):null;
  var h='<div class="rapor" id="rapor">';
  h+='<div class="rp-antet"><img src="'+esc((BOOT&&BOOT.logo)||"logo-mark.png")+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'">'+
     '<div><h2>'+t("rpAd_"+RDON)+'</h2><div class="hint">'+esc(p.ad||"")+(BOOT&&BOOT.isveren?' · '+esc(BOOT.isveren):'')+'</div></div>'+
     '<div class="sg">'+t("rpDonem",{a:trd(a[0]), b:trd(a[1])})+'<br>'+esc((BOOT&&BOOT.firma)||"")+'</div></div>';
  h+='<h4>'+t("rpBuDonem")+'</h4><div class="rp-k4 num">'+
     '<div><span>'+t("rpMetre")+'</span><b>'+tl(tt.metraj,1)+' m</b></div>'+
     '<div><span>'+t("rpVardiyaOrt")+'</span><b>'+(vo!=null?tl(vo,1):'—')+'</b></div>'+
     '<div><span>'+t("rpGunlukOrt")+'</span><b>'+(Number(tt.gun)?tl(Number(tt.metraj)/Number(tt.gun),1):'—')+'</b></div>'+
     '<div><span>'+t("rpCalisilan")+'</span><b>'+(tt.gun||0)+'</b></div></div>';
  h+='<h4>'+t("rpProjeGenel")+'</h4><div class="rp-k4 num">'+
     '<div><span>A · '+t("mVardiya")+'</span><b>'+tl((G.a||{}).ortalama,1)+'</b></div>'+
     '<div><span>B · '+t("mHafta")+'</span><b>'+((G.b||{}).ortalama!=null?tl(G.b.ortalama,0):'—')+'</b></div>'+
     '<div><span>C · '+t("mAy")+'</span><b>'+((G.c||{}).ortalama!=null?tl(G.c.ortalama,0):'—')+'</b></div>'+
     '<div><span>D · '+t("mGun")+'</span><b>'+tl((G.d||{}).gunluk,1)+'</b></div></div>';
  var gn=R.gunler||[];
  if(gn.length>1) h+='<h4>'+t("rpGunluk")+'</h4>'+cubukSvg(gn.map(function(x){ return {e:kisa(x.tarih), v:x.metraj}; }), null, {h:220, etiket:16});
  /* kuyular: devam edenler + bu dönemde teslim edilenler */
  var ky=((K||{}).kuyular||[]).filter(function(k){ return k.durum==="drilling" || (k.durum==="completed" && k.bitis>=a[0] && k.bitis<=a[1]); });
  h+='<h4>'+t("rpKuyular")+'</h4><div class="hint" style="margin-bottom:4px">'+t("rpKuyuNot")+'</div>'+
    tbl([[t("kuyu"),function(k){return '<b>'+esc(k.kod)+'</b>';}],[t("makine"),function(k){return esc(k.makine||"—");}],
         [t("planlanan"),function(k){return '<span class="num">'+(k.planlanan?tl(k.planlanan,0):'—')+'</span>';}],
         [t("delinen"),function(k){return '<span class="num">'+tl(k.derinlik,0)+'</span>';}],
         [t("durum"),function(k){return S("KDURUM")[k.durum]||k.durum;}],
         [t("bitisTahmin"),function(k){return bitisHucre(k);}]], ky, "—");
  h+='<h4>'+t("rpDurus")+'</h4>';
  if(!(U.turler||[]).length && !U.ilerleme_yok) h+='<div class="hint">'+t("rpDurusYok")+'</div>';
  else h+=durusBarlar(U.turler||[])+(U.ilerleme_yok?'<div class="hint">'+t("ilerlemeYokV")+': '+U.ilerleme_yok+'</div>':'')+durusOlaylari(U.kayitlar||[]);
  h+='<h4>'+t("rpGunluk")+'</h4>'+tbl([[t("tarih"),function(x){return trd(x.tarih);}],
       [t("metre"),function(x){return '<span class="num">'+tl(x.metraj,1)+'</span>';}],
       [t("rpMakineSay"),function(x){return x.makine;}],[t("rpKuyuSay"),function(x){return x.kuyu;}]], gn, "—",
       '<td>'+t("toplam")+'</td><td class="num">'+tl(tt.metraj,1)+'</td><td></td><td></td>');
  h+='<div class="rp-ayak"><span>'+t("rpHazirlayan")+'</span><span>'+t("rpHazirlanma")+' '+trd(iso(new Date()))+'</span></div></div>';
  $("#rapor-out").innerHTML=h;
}
$("#btn-rp").addEventListener("click", function(){ rapor(); });
$("#btn-rp-pdf").addEventListener("click", function(){
  if($("#rapor")) window.print(); else rapor(function(){ setTimeout(function(){ window.print(); }, 300); });
});
$("#btn-rp-csv").addEventListener("click", function(){
  if(!DONEM){ rapor(function(){ $("#btn-rp-csv").click(); }); return; }
  var d=DONEM, L=[];
  var q=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  L.push([q(d.proje.ad), q(trd(d.donem.baslangic)+" - "+trd(d.donem.bitis))].join(";"));
  L.push("");
  L.push([t("csvTarih"),t("csvMetraj"),t("csvGecerli"),t("csvMakine"),t("csvKuyu")].map(q).join(";"));
  (d.gunler||[]).forEach(function(x){ L.push([q(trd(x.tarih)), tl(x.metraj), tl(x.gecerli), x.makine, x.kuyu].join(";")); });
  L.push("");
  L.push([t("csvKuyu"),t("csvProgram"),"PQ","HQ","NQ",t("csvDonemMetraji"),t("csvKuyuDerinligi"),t("csvOlcum"),t("csvDurum")].map(q).join(";"));
  (d.kuyular||[]).forEach(function(x){ L.push([q(x.kuyu), q(S("PROGRAM")[x.program]||x.program||""), tl(x.pq), tl(x.hq),
      tl(x.nq), tl(x.metraj), tl(x.derinlik), x.olcum, q(S("KDURUM")[x.durum]||x.durum)].join(";")); });
  L.push("");
  L.push([t("csvMakine"),t("csvMetraj"),t("csvGun"),t("csvGunlukOrt")].map(q).join(";"));
  (d.makineler||[]).forEach(function(x){ L.push([q(x.makine), tl(x.metraj), x.gun, tl(x.gunluk_ort)].join(";")); });
  L.push("");
  L.push([q(t("csvToplam")), tl(d.toplam.metraj)].join(";"));
  var blob=new Blob(["﻿"+L.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(d.proje.ad||"rapor").replace(/[^\wğüşıöçĞÜŞİÖÇ -]/g,"")+" "+d.donem.baslangic+"_"+d.donem.bitis+".csv";
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
});
})();
</script>
</body>
